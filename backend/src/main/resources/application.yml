spring:
  application:
    name: auction-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:h2:mem:auction;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.auction.backend.auction.model,com.auction.backend.user.model
  configuration:
    map-underscore-to-camel-case: true

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket-name: howbirdfly
  access-key-id:
  access-key-secret:

auction:
  cache:
    redis:
      enabled: false
      lobby-ttl: 30m
      room-ttl: 30m
      leaderboard-ttl: 30m
      hot-room-buffer: 10m
      hot-access-threshold: 30
      hot-bid-enter-threshold: 25
      hot-bid-exit-threshold: 6
      hot-bid-enter-window: 5s
      hot-bid-exit-window: 60s
      bid-lock-ttl: 5s
      wallet-ttl: 12h
      bid-request-ttl: 2h
      hot-bid-stream-key: auction:hot-bid:stream
      hot-bid-dead-letter-stream-key: auction:hot-bid:stream:dlq
      hot-bid-stream-group: auction-hot-bid-persist
      hot-bid-stream-max-length: 100000
      hot-bid-stream-batch-size: 500
      hot-bid-stream-poll-interval-ms: 100
      hot-bid-stream-pending-timeout: 30s
      hot-bid-stream-max-backlog: 5000
      hot-bid-backpressure-key: auction:hot-bid:stream:backpressure
  persistence:
    rabbitmq:
      enabled: false
      hot-bid-enabled: false
      exchange: auction.hot-bid.exchange
      queue: auction.hot-bid.persist.queue
      routing-key: auction.hot-bid.persist
      dead-letter-exchange: auction.hot-bid.dlx
      dead-letter-queue: auction.hot-bid.persist.dlq
      dead-letter-routing-key: auction.hot-bid.persist.dead
      max-attempts: 3
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 5s
  bid-rate-limit:
    enabled: true
    user-room-interval: 800ms
