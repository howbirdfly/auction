<div id="hot-room-threshold">
  <style>
    #hot-room-threshold {
      display: grid;
      gap: 16px;
      color: var(--foreground);
    }

    #hot-room-threshold .threshold-layout {
      display: grid;
      gap: 16px;
    }

    #hot-room-threshold .threshold-controls {
      align-items: end;
    }

    #hot-room-threshold .threshold-control {
      display: grid;
      gap: 6px;
      min-width: 180px;
      flex: 1 1 180px;
    }

    #hot-room-threshold .threshold-chart {
      min-height: 280px;
    }

    #hot-room-threshold svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #hot-room-threshold .axis-label,
    #hot-room-threshold .tick-label,
    #hot-room-threshold .series-label,
    #hot-room-threshold .threshold-label {
      fill: var(--foreground);
      font-size: 12px;
    }

    #hot-room-threshold .grid-line {
      stroke: var(--border);
      stroke-width: 1;
    }

    #hot-room-threshold .threshold-line {
      stroke: var(--orange);
      stroke-width: 1.5;
    }

    #hot-room-threshold .series-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--foreground);
    }

    #hot-room-threshold .series-swatch {
      width: 18px;
      height: 3px;
      display: inline-block;
    }

    #hot-room-threshold .series-swatch.cold {
      background: var(--viz-series-1);
    }

    #hot-room-threshold .series-swatch.hot {
      background: var(--viz-series-2);
    }

    #hot-room-threshold .threshold-note {
      min-height: 20px;
    }
  </style>

  <h2 style="margin:0">热房间升级阈值：按单房间出价 QPS，而不是全站 QPS</h2>

  <div class="viz-controls threshold-controls">
    <label class="threshold-control">
      <span class="form-label">MySQL 冷路径单次竞价耗时 <span id="coldServiceValue" class="tabular-nums">18 ms</span></span>
      <input id="coldServiceInput" class="form-range" type="range" min="8" max="30" step="1" value="18">
    </label>
    <label class="threshold-control">
      <span class="form-label">Redis 热路径单次竞价耗时 <span id="hotServiceValue" class="tabular-nums">5 ms</span></span>
      <input id="hotServiceInput" class="form-range" type="range" min="1" max="10" step="0.5" value="5">
    </label>
    <label class="threshold-control">
      <span class="form-label">安全利用率 <span id="utilizationValue" class="tabular-nums">55%</span></span>
      <input id="utilizationInput" class="form-range" type="range" min="40" max="70" step="5" value="55">
    </label>
  </div>

  <div class="viz-grid">
    <div class="card viz-stat">
      <div class="text-muted">建议进入 HOT</div>
      <div id="enterThreshold" class="viz-stat-value tabular-nums">30 QPS</div>
      <div class="text-small text-muted">连续 5 秒达到，允许 4/5 窗口命中</div>
    </div>
    <div class="card viz-stat">
      <div class="text-muted">建议退出 HOT</div>
      <div id="exitThreshold" class="viz-stat-value tabular-nums">8 QPS</div>
      <div class="text-small text-muted">连续 60 秒低于阈值再退出</div>
    </div>
    <div class="card viz-stat">
      <div class="text-muted">冷路径安全容量</div>
      <div id="coldCapacity" class="viz-stat-value tabular-nums">56 QPS</div>
      <div class="text-small text-muted">进入阈值取安全容量的约 55%</div>
    </div>
  </div>

  <div class="viz-row">
    <button id="toggleCold" class="series-toggle" type="button" aria-pressed="true">
      <span class="series-swatch cold" aria-hidden="true"></span>
      MySQL 冷路径
    </button>
    <button id="toggleHot" class="series-toggle" type="button" aria-pressed="true">
      <span class="series-swatch hot" aria-hidden="true"></span>
      Redis 热路径
    </button>
  </div>

  <div id="thresholdChart" class="threshold-chart" role="img" aria-label="单房间出价 QPS 与稳态排队延迟的容量曲线"></div>
  <div id="thresholdNote" class="threshold-note text-small text-muted" aria-live="polite"></div>

  <div class="table-responsive">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>单房间出价 QPS</th>
          <th>冷路径状态</th>
          <th>热路径状态</th>
          <th>建议动作</th>
        </tr>
      </thead>
      <tbody id="thresholdTableBody"></tbody>
    </table>
  </div>

  <div class="text-small text-muted">
    注：曲线使用单房间串行服务的容量模型，用于确定触发区间；面试数据应再用 JMeter 实测 P95/P99、错误率和数据库锁等待替换模型值。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById("hot-room-threshold");
  if (!root || !window.d3) return;

  const d3 = window.d3;
  const chart = document.getElementById("thresholdChart");
  const coldInput = document.getElementById("coldServiceInput");
  const hotInput = document.getElementById("hotServiceInput");
  const utilInput = document.getElementById("utilizationInput");
  const coldValue = document.getElementById("coldServiceValue");
  const hotValue = document.getElementById("hotServiceValue");
  const utilValue = document.getElementById("utilizationValue");
  const enterEl = document.getElementById("enterThreshold");
  const exitEl = document.getElementById("exitThreshold");
  const capacityEl = document.getElementById("coldCapacity");
  const noteEl = document.getElementById("thresholdNote");
  const tableBody = document.getElementById("thresholdTableBody");
  const coldButton = document.getElementById("toggleCold");
  const hotButton = document.getElementById("toggleHot");

  const visible = { cold: true, hot: true };

  function roundTo(value, step) {
    return Math.max(step, Math.round(value / step) * step);
  }

  function latency(qps, serviceMs) {
    const capacity = 1000 / serviceMs;
    const utilization = qps / capacity;
    if (utilization >= 0.98) return 300;
    return Math.min(300, serviceMs / (1 - utilization));
  }

  function stateAt(qps, enter, exit) {
    if (qps >= enter) return "进入 HOT";
    if (qps >= exit) return "观察/预热";
    return "保持冷路径";
  }

  function readState() {
    const coldService = Number(coldInput.value);
    const hotService = Number(hotInput.value);
    const utilization = Number(utilInput.value) / 100;
    const coldCapacityRaw = 1000 / coldService;
    const enter = roundTo(coldCapacityRaw * utilization, 5);
    const exit = Math.max(1, Math.round(enter * 0.25));
    return { coldService, hotService, utilization, coldCapacityRaw, enter, exit };
  }

  function updateSummary(state) {
    coldValue.textContent = `${state.coldService} ms`;
    hotValue.textContent = `${state.hotService} ms`;
    utilValue.textContent = `${Math.round(state.utilization * 100)}%`;
    enterEl.textContent = `${state.enter} QPS`;
    exitEl.textContent = `${state.exit} QPS`;
    capacityEl.textContent = `${Math.round(state.coldCapacityRaw)} QPS`;
    noteEl.textContent =
      `当前配置下：约 ${Math.round(state.coldCapacityRaw * 0.75)} QPS 时冷路径进入高风险区；` +
      `建议 ${state.enter} QPS 触发升级，${state.exit} QPS 退出，避免抖动。`;
  }

  function updateTable(state) {
    const rows = [5, 10, 20, state.enter, state.enter * 2, state.enter * 4]
      .map((value) => Math.max(1, Math.round(value)))
      .filter((value, index, values) => values.indexOf(value) === index)
      .sort((a, b) => a - b);

    tableBody.innerHTML = rows.map((qps) => {
      const cold = latency(qps, state.coldService);
      const hot = latency(qps, state.hotService);
      const action = stateAt(qps, state.enter, state.exit);
      return `
        <tr>
          <td class="tabular-nums">${qps}</td>
          <td class="tabular-nums">${cold >= 300 ? "过载" : `${Math.round(cold)} ms`}</td>
          <td class="tabular-nums">${hot >= 300 ? "过载" : `${Math.round(hot)} ms`}</td>
          <td>${action}</td>
        </tr>
      `;
    }).join("");
  }

  function drawChart(state) {
    const width = Math.max(320, chart.clientWidth || 736);
    const height = Math.max(260, Math.min(360, width * 0.46));
    const margin = { top: 24, right: 28, bottom: 54, left: 64 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const qMax = Math.max(80, Math.ceil((state.enter * 3) / 10) * 10);
    const x = d3.scaleLinear().domain([0, qMax]).range([0, innerWidth]);
    const y = d3.scaleLinear().domain([0, 160]).range([innerHeight, 0]);
    const samples = d3.range(0, qMax + qMax / 80, qMax / 80).map((qps) => ({
      qps,
      cold: latency(qps, state.coldService),
      hot: latency(qps, state.hotService),
    }));
    const line = (key) => d3.line()
      .x((d) => x(d.qps))
      .y((d) => y(Math.min(160, d[key])))
      .curve(d3.curveMonotoneX);

    const svg = d3.select(chart).selectAll("svg").data([null]).join("svg")
      .attr("viewBox", `0 0 ${width} ${height}`);
    svg.selectAll("*").remove();

    const plot = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const xTicks = x.ticks(width < 520 ? 4 : 6);
    const yTicks = y.ticks(5);

    plot.selectAll(".x-grid")
      .data(xTicks)
      .join("line")
      .attr("class", "grid-line")
      .attr("x1", (d) => x(d))
      .attr("x2", (d) => x(d))
      .attr("y1", 0)
      .attr("y2", innerHeight);

    plot.selectAll(".y-grid")
      .data(yTicks)
      .join("line")
      .attr("class", "grid-line")
      .attr("x1", 0)
      .attr("x2", innerWidth)
      .attr("y1", (d) => y(d))
      .attr("y2", (d) => y(d));

    plot.append("rect")
      .attr("data-chart-frame", "")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", innerWidth)
      .attr("height", innerHeight)
      .attr("fill", "none")
      .attr("stroke", "var(--border)");

    if (visible.cold) {
      plot.append("path")
        .datum(samples)
        .attr("d", line("cold"))
        .attr("fill", "none")
        .attr("stroke", "var(--viz-series-1)")
        .attr("stroke-width", 2);
    }

    if (visible.hot) {
      plot.append("path")
        .datum(samples)
        .attr("d", line("hot"))
        .attr("fill", "none")
        .attr("stroke", "var(--viz-series-2)")
        .attr("stroke-width", 2);
    }

    plot.append("line")
      .attr("class", "threshold-line")
      .attr("x1", x(state.enter))
      .attr("x2", x(state.enter))
      .attr("y1", 0)
      .attr("y2", innerHeight);

    plot.append("text")
      .attr("class", "threshold-label")
      .attr("x", x(state.enter) + 6)
      .attr("y", 14)
      .text(`进入 HOT ${state.enter} QPS`);

    plot.append("line")
      .attr("x1", x(state.exit))
      .attr("x2", x(state.exit))
      .attr("y1", 0)
      .attr("y2", innerHeight)
      .attr("stroke", "var(--muted-foreground)")
      .attr("stroke-width", 1)
      .attr("stroke-dasharray", "4 4");

    plot.append("text")
      .attr("class", "threshold-label")
      .attr("x", x(state.exit) + 6)
      .attr("y", innerHeight - 8)
      .text(`退出 ${state.exit}`);

    plot.selectAll(".x-tick")
      .data(xTicks)
      .join("text")
      .attr("class", "tick-label")
      .attr("text-anchor", "middle")
      .attr("x", (d) => x(d))
      .attr("y", innerHeight + 20)
      .text((d) => d);

    plot.selectAll(".y-tick")
      .data(yTicks)
      .join("text")
      .attr("class", "tick-label")
      .attr("text-anchor", "end")
      .attr("x", -10)
      .attr("y", (d) => y(d) + 4)
      .text((d) => d);

    plot.append("text")
      .attr("class", "axis-label")
      .attr("data-axis", "x")
      .attr("text-anchor", "middle")
      .attr("x", innerWidth / 2)
      .attr("y", innerHeight + 44)
      .text("单房间出价 QPS");

    plot.append("text")
      .attr("class", "axis-label")
      .attr("data-axis", "y")
      .attr("text-anchor", "middle")
      .attr("transform", `rotate(-90)`)
      .attr("x", -innerHeight / 2)
      .attr("y", -46)
      .text("稳态排队延迟估算（ms）");

    const coldPoint = samples.reduce((best, item) =>
      Math.abs(item.qps - state.enter) < Math.abs(best.qps - state.enter) ? item : best
    );
    if (visible.cold) {
      plot.append("text")
        .attr("class", "series-label")
        .attr("x", x(coldPoint.qps) - 8)
        .attr("y", Math.max(12, y(Math.min(160, coldPoint.cold)) - 8))
        .attr("text-anchor", "end")
        .text("MySQL");
    }
    if (visible.hot) {
      const hotAtThreshold = latency(state.enter, state.hotService);
      plot.append("text")
        .attr("class", "series-label")
        .attr("x", x(state.enter) - 8)
        .attr("y", Math.max(12, y(Math.min(160, hotAtThreshold)) - 8))
        .attr("text-anchor", "end")
        .text("Redis");
    }
  }

  function render() {
    const state = readState();
    updateSummary(state);
    updateTable(state);
    drawChart(state);
  }

  [coldInput, hotInput, utilInput].forEach((input) => input.addEventListener("input", render));

  coldButton.addEventListener("click", () => {
    visible.cold = !visible.cold;
    coldButton.setAttribute("aria-pressed", String(visible.cold));
    drawChart(readState());
  });

  hotButton.addEventListener("click", () => {
    visible.hot = !visible.hot;
    hotButton.setAttribute("aria-pressed", String(visible.hot));
    drawChart(readState());
  });

  if ("ResizeObserver" in window) {
    new ResizeObserver(() => drawChart(readState())).observe(chart);
  }

  render();
})();
</script>
